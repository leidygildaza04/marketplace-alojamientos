<button class="profile-trigger" type="button" (click)="show()">Mi perfil</button>

@if (open) {
  <div class="profile-backdrop" (click)="close()">
    <section
      class="profile-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="profile-title"
      (click)="$event.stopPropagation()"
    >
      <button class="profile-close" type="button" aria-label="Cerrar perfil" (click)="close()">×</button>
      <p class="profile-eyebrow">TU CUENTA TRAVESÍA</p>
      <h2 id="profile-title">Mi perfil</h2>
      <p class="profile-intro">Consulta tus datos y actualiza tu nombre o teléfono.</p>

      @if (profile) {
        <form (ngSubmit)="save()" novalidate>
          <label for="profile-name">Nombre completo</label>
          <input id="profile-name" name="fullName" [(ngModel)]="fullName" maxlength="120" autocomplete="name" />

          <label for="profile-email">Correo electrónico</label>
          <input id="profile-email" name="email" [value]="profile.email" readonly aria-describedby="profile-locked-note" />

          <label for="profile-phone">Teléfono</label>
          <input id="profile-phone" name="phone" [(ngModel)]="phone" maxlength="30" autocomplete="tel" placeholder="Agrega tu teléfono" />

          <label for="profile-role">Rol</label>
          <input id="profile-role" name="role" [value]="roleLabel" readonly aria-describedby="profile-locked-note" />
          <small id="profile-locked-note" class="profile-locked-note">El correo y el rol no se pueden modificar.</small>

          @if (error) { <p class="profile-error" role="alert">{{ error }}</p> }
          @if (saved) { <p class="profile-success" role="status">Tus datos se actualizaron correctamente.</p> }

          <div class="profile-actions">
            <button class="profile-cancel" type="button" (click)="close()">Cerrar</button>
            <button class="profile-save" type="submit">Guardar cambios</button>
          </div>
        </form>
      } @else {
        <p class="profile-error" role="alert">No se encontró una sesión activa.</p>
      }
    </section>
  </div>
}
