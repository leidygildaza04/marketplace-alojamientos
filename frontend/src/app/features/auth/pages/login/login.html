<main class="access-page">
  <section class="access-card" aria-labelledby="access-title">
    <p class="eyebrow"><span aria-hidden="true"></span> MARKETPLACE DE ALOJAMIENTOS</p>
    <h1 id="access-title">Qué bueno verte de nuevo</h1>
    <p class="intro">Inicia sesión para continuar explorando Estancia.</p>

    <form class="login-form" (ngSubmit)="enter()">
      <label for="username">Usuario</label>
      <input id="username" name="username" [(ngModel)]="username" autocomplete="username" required />
      <label for="password">Clave</label>
      <input id="password" name="password" [(ngModel)]="password" type="password" autocomplete="current-password" required />
      @if (error) { <p class="form-error" role="alert">{{ error }}</p> }
      <button class="enter-button" type="submit">Entrar</button>
    </form>

    <p class="access-note">¿Aún no tienes cuenta? <a routerLink="/registro">Crear cuenta</a> o <a routerLink="/registro-anfitrion">publicar un alojamiento</a>.</p>
  </section>
</main>
