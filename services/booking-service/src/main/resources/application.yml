server:
  port: 8083
spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:mysql://localhost:3306/booking_db}
    username: ${BOOKING_DB_USER:app}
    password: ${BOOKING_DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
