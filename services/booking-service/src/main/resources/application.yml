server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:mysql://localhost:3307/booking_db}
    username: ${BOOKING_DB_USER:app}
    password: ${BOOKING_DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret-change-me}
  cotizacion:
    porcentaje-servicio: ${COTIZACION_PORCENTAJE_SERVICIO:10}
    porcentaje-descuento: ${COTIZACION_PORCENTAJE_DESCUENTO:0}